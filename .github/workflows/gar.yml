name: Build and push to Google Artifact Registry

on:
  push:
    branches: [main]
    paths: # only what ends up in the image, plus this file
      - Server/**
      - Dockerfile
      - requirements.txt
      - .github/workflows/gar.yml
  workflow_dispatch:

permissions:
  id-token: write # lets the job get Google credentials through OIDC, no stored keys
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: flake8 Server tests
      - run: pytest -q

  push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - id: registry
        run: echo "host=${GAR_IMAGE%%/*}" >> "$GITHUB_OUTPUT"
        env:
          GAR_IMAGE: ${{ vars.GAR_IMAGE }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false # otherwise attestations count against the registry's keep-2 cleanup policy
          tags: ${{ vars.GAR_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SSH in through the Cloudflare Tunnel and run update.sh, the only thing the deploy key can
      # do. Without this the server still picks up the image within the hour. See
      # infra/google/deploy.tf.
      - name: Deploy to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ProxyCommand="$PWD/cloudflared access ssh --hostname %h" \
            deploy@ssh.donutgames.co.uk
