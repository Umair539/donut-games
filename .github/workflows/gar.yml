name: Build and push to Google Artifact Registry

on:
  push:
    branches: [main]
    paths: # only what ends up in the image, plus this file
      - Server/**
      - web/**
      - Dockerfile
      - requirements.txt
      - .github/workflows/gar.yml
  workflow_dispatch:

permissions:
  id-token: write # lets the job get Google credentials through OIDC, no stored keys
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: flake8 Server tests
      - run: pytest -q

  push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - id: registry
        run: echo "host=${GAR_IMAGE%%/*}" >> "$GITHUB_OUTPUT"
        env:
          GAR_IMAGE: ${{ vars.GAR_IMAGE }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false # otherwise attestations count against the registry's keep-2 cleanup policy
          tags: ${{ vars.GAR_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
