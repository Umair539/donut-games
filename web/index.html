<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Donut Games</title>
  <meta name="description" content="Donut-themed games to play online with friends. Host a game and share the code.">
  <link rel="icon" href="sprites/pink.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- one stylesheet per game -->
  <link rel="stylesheet" href="games/connect4/connect4.css">
  <link rel="stylesheet" href="games/switch/switch.css">
</head>
<body>
  <main>
    <section id="screen-connecting" class="screen card center" hidden>
      <div class="spinner" aria-hidden="true"></div>
      <p>Getting your game back…</p>
    </section>

    <section id="screen-home" class="screen" hidden>
      <header class="hero">
        <div class="hero-donuts" aria-hidden="true">
          <img src="sprites/choccy.png" alt="">
          <img src="sprites/pink.png" alt="">
        </div>
        <h1>Donut Games</h1>
        <p class="tagline">Host a game, then send the code to your friends.</p>
      </header>

      <div class="card">
        <div class="name-field">
          <label for="player-name">Your name <span class="muted">(optional)</span></label>
          <input id="player-name" class="name-input" placeholder="Player" maxlength="16"
                 autocomplete="nickname" spellcheck="false">
        </div>
        <h2>Host a game</h2>
        <div id="game-list" class="game-list"></div>
        <div class="divider"><span>or join one</span></div>
        <form id="join-form" class="join-row" autocomplete="off">
          <label class="sr-only" for="join-code">Game code</label>
          <input id="join-code" class="code-input" placeholder="CODE" maxlength="6"
                 inputmode="text" autocapitalize="characters" spellcheck="false" required>
          <button class="btn" type="submit">Join</button>
        </form>
        <p id="home-error" class="error" role="alert" hidden></p>
      </div>

      <footer class="site-footer">
        <a href="https://github.com/Umair539/donut-games" target="_blank" rel="noreferrer"
           aria-label="View this project on GitHub" title="View this project on GitHub">
          <svg width="22" height="22" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
          </svg>
        </a>
      </footer>
    </section>

    <section id="screen-create" class="screen" hidden>
      <form id="create-form" class="card">
        <h2 id="create-title">Game settings</h2>
        <div id="settings"></div>
        <div id="preview" aria-hidden="true"></div>
        <p id="create-error" class="error" role="alert" hidden></p>
        <div class="actions">
          <button id="create-back" class="btn btn-ghost" type="button">Back</button>
          <button class="btn btn-primary" type="submit">Create</button>
        </div>
      </form>
    </section>

    <section id="screen-lobby" class="screen card center" hidden>
      <p class="lobby-title">
        <span id="lobby-game" class="muted"></span>
        <button id="lobby-help" class="info-btn" type="button" aria-label="Instructions">i</button>
      </p>
      <p class="muted small">Share this code</p>
      <p id="lobby-code" class="big-code"></p>
      <div class="copy-row">
        <button id="copy-code" class="btn" type="button">Copy code</button>
        <button id="copy-link" class="btn btn-primary" type="button">Copy invite link</button>
      </div>

      <div class="players-box">
        <h2 id="lobby-heading"></h2>
        <ul id="lobby-players" class="lobby-players"></ul>
        <div id="add-bots" class="add-bots" hidden></div>
      </div>

      <p id="lobby-settings" class="muted small"></p>
      <p id="lobby-wait" class="waiting"></p>
      <div class="actions">
        <button id="lobby-leave" class="btn btn-ghost" type="button">Leave</button>
        <button id="start" class="btn btn-primary" type="button">Start game</button>
      </div>
    </section>

    <section id="screen-game" class="screen" hidden>
      <p id="turn-timer" class="turn-timer" hidden></p>
      <div id="game-root"></div>
      <p id="banner" class="banner" role="status" hidden></p>
      <div class="actions game-actions">
        <button id="rematch" class="btn btn-primary" type="button" hidden>Rematch</button>
      </div>
    </section>
  </main>

  <!-- float over the game: leave in the bottom left corner, chat in the bottom right -->
  <div id="game-float" hidden>
      <button id="game-leave" class="float-btn leave-btn" type="button" aria-label="Leave game"
              title="Leave game">
        <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="3"
                stroke-linecap="round"/>
        </svg>
      </button>

      <button id="chat-open" class="float-btn chat-open" type="button" aria-label="Chat"
              title="Chat">
        <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
          <path fill="currentColor" d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>
        </svg>
        <span id="chat-unread" class="chat-unread" hidden></span>
      </button>

      <div id="chat" class="chat card" role="dialog" aria-labelledby="chat-title" hidden>
        <div class="chat-head">
          <h2 id="chat-title">Chat</h2>
          <button id="chat-close" class="info-btn" type="button" aria-label="Close chat">✕</button>
        </div>
        <ol id="chat-log" class="chat-log" aria-live="polite"></ol>
        <form id="chat-form" class="chat-form" autocomplete="off">
          <label class="sr-only" for="chat-input">Message</label>
          <input id="chat-input" class="name-input" maxlength="200" placeholder="Say something…"
                 spellcheck="true">
          <button class="btn btn-primary" type="submit">Send</button>
        </form>
      </div>
  </div>

  <div id="toast" class="toast" role="alert" hidden></div>

  <div id="confirm-leave" class="overlay" hidden>
    <div class="confirm-window card" role="alertdialog" aria-modal="true"
         aria-labelledby="confirm-title">
      <h2 id="confirm-title">Are you sure you want to leave?</h2>
      <p class="muted">You won't be able to come back into this game.</p>
      <div class="actions">
        <button id="confirm-stay" class="btn btn-ghost" type="button">Stay</button>
        <button id="confirm-go" class="btn btn-danger" type="button">Leave</button>
      </div>
    </div>
  </div>

  <div id="help" class="overlay" hidden>
    <div class="help-window card" role="dialog" aria-modal="true" aria-labelledby="help-title">
      <h2 id="help-title">Instructions</h2>
      <p id="help-game" class="muted"></p>
      <div id="help-body"></div>
      <button id="help-close" class="btn btn-primary" type="button">Close</button>
    </div>
  </div>

  <!-- each game registers itself in window.Games before the shell starts -->
  <script src="games/connect4/connect4.js"></script>
  <script src="games/switch/switch.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
