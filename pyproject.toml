[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Connect_Donut"
version = "0.2.0"
description = "Donut-themed multiplayer games played in the browser, hosted with room codes."
authors = [{name = "Umair", email = "umohammed235@outlook.com"}]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/Umair539/Connect_Donut"

[project.scripts]
run_web = "Server.core.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["Server*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
