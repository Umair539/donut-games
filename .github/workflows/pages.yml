name: Deploy web pages to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SERVER_HOST: server.donutgames.co.uk

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Point the pages at the game server, which is on another host in production
      - run: echo "const SERVER_HOST = \"$SERVER_HOST\";" > web/config.js

      # The Pages project is created by Terraform (infra/google/cloudflare.tf)
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=donut-games --branch=main
