name: Test and deploy

# One workflow for both halves of the site, so neither goes out unless every check passed:
# the server's tests, flake8 and the browser tests. The server goes first and the web pages
# after it, so new pages never talk to an old server, and if the server deploy fails the
# pages stay as they are.
on:
  push:
    branches: [main]
  workflow_dispatch: # deploys both

permissions:
  contents: read

jobs:
  # what this push changed: the server (what ends up in the image) and the web pages. A
  # change to a workflow deploys both.
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.diff.outputs.server }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "server=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$files"
          has() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          echo "server=$(has '^(Server/|Dockerfile$|requirements\.txt$|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "web=$(has '^(web/|\.github/workflows/)')" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: flake8 Server tests
      - run: pytest -q

  ui:
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/ui-tests.yml

  server:
    needs: [changes, test, ui]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets the job get Google credentials through OIDC, no stored keys
      contents: read
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - id: registry
        run: echo "host=${GAR_IMAGE%%/*}" >> "$GITHUB_OUTPUT"
        env:
          GAR_IMAGE: ${{ vars.GAR_IMAGE }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false # otherwise attestations count against the registry's keep-2 cleanup policy
          tags: ${{ vars.GAR_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SSH in through the Cloudflare Tunnel and run update.sh, the only thing the deploy key can
      # do. Without this the server still picks up the image within the hour. See
      # infra/google/deploy.tf.
      - name: Deploy to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          install -m 700 -d ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ProxyCommand="$PWD/cloudflared access ssh --hostname %h" \
            deploy@ssh.donutgames.co.uk

  pages:
    needs: [changes, test, ui, server]
    # after the server, whether or not it had anything to deploy, but never after it failed
    if: >-
      always() && needs.changes.outputs.web == 'true'
      && needs.test.result == 'success' && needs.ui.result == 'success'
      && (needs.server.result == 'success' || needs.server.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: server.donutgames.co.uk
    steps:
      - uses: actions/checkout@v5

      # Point the pages at the game server, which is on another host in production
      - run: echo "const SERVER_HOST = \"$SERVER_HOST\";" > web/config.js

      # The Pages project is created by Terraform (infra/google/cloudflare.tf)
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=donut-games --branch=main
